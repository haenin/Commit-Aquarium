<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140">
  <defs>
    <radialGradient id="cf-body" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="30%" stop-color="#ff7c00"/>
      <stop offset="75%" stop-color="#e84400"/>
      <stop offset="100%" stop-color="#a02800"/>
    </radialGradient>
    <radialGradient id="cf-stripe" cx="50%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ddeeff"/>
      <stop offset="100%" stop-color="#b8d4ff"/>
    </radialGradient>
    <radialGradient id="cf-gloss" cx="30%" cy="22%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.82)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="cf-tail" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#cc3800" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ff6600" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff9040"/>
    </linearGradient>
    <filter id="cf-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#a02000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tail fan -->
  <path d="M158,70 C145,40 195,20 205,28 C195,50 200,90 205,112 C195,120 145,100 158,70Z" fill="url(#cf-tail)" filter="url(#cf-shadow)"/>

  <!-- body -->
  <ellipse cx="90" cy="70" rx="80" ry="50" fill="url(#cf-body)" filter="url(#cf-shadow)"/>

  <!-- black border stripes -->
  <ellipse cx="112" cy="70" rx="13" ry="50" fill="#111" opacity="0.75"/>
  <ellipse cx="36" cy="70" rx="10" ry="38" fill="#111" opacity="0.65"/>

  <!-- white stripes -->
  <ellipse cx="112" cy="70" rx="10" ry="46" fill="url(#cf-stripe)"/>
  <ellipse cx="36" cy="70" rx="7" ry="34" fill="url(#cf-stripe)"/>

  <!-- dorsal fin -->
  <path d="M55,20 Q90,4 128,20" stroke="#cc3800" stroke-width="3" fill="#ff6600" opacity="0.6"/>
  <path d="M55,22 Q90,6 128,22 L128,20 Q90,4 55,20Z" fill="#ff5500" opacity="0.45"/>

  <!-- pectoral fin -->
  <ellipse cx="82" cy="98" rx="26" ry="11" fill="#ff7700" opacity="0.42" transform="rotate(15,82,98)"/>

  <!-- gloss -->
  <ellipse cx="72" cy="46" rx="52" ry="28" fill="url(#cf-gloss)"/>

  <!-- eye white -->
  <circle cx="34" cy="63" r="11" fill="#f0f8ff"/>
  <!-- iris -->
  <circle cx="34" cy="63" r="8" fill="#1a0800"/>
  <!-- pupil shine -->
  <circle cx="30" cy="59" r="3.5" fill="rgba(255,255,255,0.92)"/>
  <circle cx="37" cy="66" r="1.5" fill="rgba(255,255,255,0.45)"/>
</svg>
